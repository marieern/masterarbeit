controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 5.0 
    
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] 
    controller_plugins: ["FollowPath"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.2
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      model_dt: 0.2
      time_steps: 18
      
      # Weniger Pfade simulieren, reicht für Jackal
      batch_size: 600 
      
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.3
      vx_min: 0.0
      wz_max: 0.6
      is_holonomic_drive: false 
      
      transform_tolerance: 0.5 

      # critics bestimmen das Fahrverhalten
      # PathAlignCritic ist extrem hoch (14.0), um das Jackal UGV strikt auf dem Theta*-Pfad zu halten, was für das Durchfahren des schmalen Hallentors zwingend nötig ist.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic"]
      
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0 # bestraft Trajektorien, die in Hindernisse fahren (Kollisionsvermeidung)

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0 # zieht den Roboter in Richtung des Ziels
        threshold_to_consider: 1.4

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0 # höchstes Gewicht -> Zwingt den MPPI-Controller, den globalen Pfad exakt nachzufahren
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        threshold_to_consider: 0.5
        max_angle_to_furthest: 0.785
        mode: 0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
        
planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner"
      how_many_corners: 8
      allow_unknown: true
      w_euc_cost: 1.0
      w_traversal_cost: 2.0

      use_final_approach_orientation: true
      smoother_max_iterations: 1000
      smooth_path: true # Versucht, die Ecken rund zu machen

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      transform_tolerance: 0.5
      # Footprint des Jackal UGV [m] (Länge: 0.60m, Breite: 0.52m)
      # Werte definieren die Ecken vom base_link aus gesehen.
      footprint: "[ [0.30, 0.26], [0.30, -0.26], [-0.30, -0.26], [-0.30, 0.26] ]"
      
      plugins: ["obstacle_layer", "zinken_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan_rear_filtered #scan_restricted
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.10
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 5.0
          obstacle_max_range: 2.5
          inf_is_valid: true
        
        scan_rear_filtered:
          topic: /scan_rear_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 5.0
          obstacle_max_range: 2.5
          inf_is_valid: true
        
      # NEUER LAYER NUR FÜR DIE ZINKEN
      zinken_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Zwei virtuelle Sensoren für das gleiche Topic
        observation_sources: mark_zinken clear_ghosts
        
        mark_zinken:
          topic: /scan_restricted
          # Filtert den Boden weg. Startet bei 4 cm
          min_obstacle_height: 0.01 
          max_obstacle_height: 0.30     
          marking: True
          clearing: False # Räumt nicht auf, markiert nur die Zinken
          data_type: "PointCloud2"
          raytrace_max_range: 2.0 
          obstacle_max_range: 1.5

        clear_ghosts:
          topic: /scan_restricted
          # Nimmt alles auf, auch den tiefen Fußboden
          min_obstacle_height: -0.50 
          max_obstacle_height: 0.50     
          marking: False # markiert keine Hindernisse
          clearing: True # Nutzt die Bodenpunkte nur, um Geister auf dem Weg zu löschen
          data_type: "PointCloud2"
          raytrace_max_range: 4.0 
          obstacle_max_range: 3.5
              
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.7

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      resolution: 0.05
      transform_tolerance: 0.5
      # Footprint des Jackal UGV [m] (Länge: 0.60m, Breite: 0.52m)
      # Werte definieren die Ecken vom base_link aus gesehen.
      footprint: "[ [0.30, 0.26], [0.30, -0.26], [-0.30, -0.26], [-0.30, 0.26] ]"
      
      plugins: ["static_layer", "obstacle_layer", "zinken_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan scan_rear_filtered
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          min_obstacle_height: 0.10
          clearing: True #
          marking: True
          data_type: "LaserScan"
          # Wenn ein Strahl nichts trifft, wird bis 5.0m alles als "Frei" markiert. Das hilft, Geisterwände schneller zu löschen.
          raytrace_max_range: 6.0 
          obstacle_max_range: 2.5
          inf_is_valid: true
        
        scan_rear_filtered:
          topic: /scan_rear_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          raytrace_max_range: 5.0
          obstacle_max_range: 2.5
          inf_is_valid: true
        
      # NEUER LAYER NUR FÜR DIE ZINKEN
      zinken_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # Zwei virtuelle Sensoren für das gleiche Topic
        observation_sources: mark_zinken clear_ghosts
        
        mark_zinken:
          topic: /scan_restricted
          # Filtert den Boden absolut sicher weg. Startet bei 4 cm
          min_obstacle_height: 0.01 
          max_obstacle_height: 0.30     
          marking: True
          clearing: False # Räumt nicht auf, markiert nur die Zinken
          data_type: "PointCloud2"
          raytrace_max_range: 2.0 
          obstacle_max_range: 1.5

        clear_ghosts:
          topic: /scan_restricted
          # Nimmt alles auf (auch den tiefen Fußboden)
          min_obstacle_height: -0.50 
          max_obstacle_height: 0.50     
          marking: False # Markiert keine Hindernisse
          clearing: True # Nutzt die Bodenpunkte nur, um Geister auf dem Weg zu löschen
          data_type: "PointCloud2"
          raytrace_max_range: 4.0 
          obstacle_max_range: 3.5
             
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.7

behavior_server:
  ros__parameters:
    use_sim_time: True
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"   
    backup:
      plugin: "nav2_behaviors/BackUp" 
    wait:
      plugin: "nav2_behaviors/Wait"   
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: ['map_server', 'amcl', 'planner_server', 'controller_server', 'behavior_server', 'bt_navigator']
