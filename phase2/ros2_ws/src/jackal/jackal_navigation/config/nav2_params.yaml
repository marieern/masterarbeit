map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/marieernst/ros2_ws/jackal/jackal_navigation/maps/lager_karte_jackal.yaml" 

amcl:
  ros__parameters:
    use_sim_time: True
    tf_broadcast: false #false, da der EKF die TF map->odom macht 
    
    # Standard Parameter
    base_frame_id: "base_link"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    
    # Tuning für schnelles Einrasten
    update_min_d: 0.1 
    update_min_a: 0.1
    min_particles: 500
    max_particles: 4000 # Begrenzt auf 4000, um die CPU-Auslastung auf der Hardware zu schonen
    
    # Toleranz gegen Zeit-Probleme
    transform_tolerance: 1.0
    
    # Helfen beim Wiederfinden ("Global Localization" Modus verhindern)
    save_pose_rate: 0.5

    # HIER DIE GLEICHEN START-KOORDINATEN WIE IN GAZEBO
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0} 


