map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "/home/marieernst/ros2_ws/lager_karte_jackal.yaml" #

amcl:
  ros__parameters:
    use_sim_time: True
    alpha1: 0.2 # Erhöht für schnellere Korrektur
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link" # Zurück auf base_link wie in der stabilen Datei
    global_frame_id: "map"
    odom_frame_id: "odom"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    scan_topic: scan
    # Puffer gegen Mac-Latenz und CPU-Last:
    update_min_d: 0.1 #
    update_min_a: 0.1 #
    transform_tolerance: 1.0 # DER WICHTIGSTE FIX
    # KORREKTUR: AMCL MUSS die TF senden, damit Laserpunkte feststehen
    tf_broadcast: true
    laser_max_range: 50.0 # Für die große Halle

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 5.0 # Niedrigere Frequenz spart CPU
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    current_goal_checker: ["general_goal_checker"]
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      # Nutzt den RotationShimController für stabiles Drehen im Stand
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 1.0
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      # Geschwindigkeiten und sanfte Beschleunigung gegen Radschlupf:
      desired_linear_vel: 0.20
      max_velocity: 0.20
      max_acceleration: 0.2 # Verhindert das Schwimmen
      transform_tolerance: 1.0 #
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      use_velocity_scaled_lookahead_dist: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 0.5
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_theta_star_planner/ThetaStarPlanner" #
      how_many_corners: 8

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.15
      transform_tolerance: 1.0
      footprint: "[ [0.30, 0.26], [0.30, -0.26], [-0.30, -0.26], [-0.30, 0.26] ]"
      
      # KORREKTUR: Nur obstacle und inflation (KEIN static_layer!)
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          obstacle_max_range: 2.5
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      resolution: 0.15
      transform_tolerance: 1.0
      footprint: "[ [0.30, 0.26], [0.30, -0.26], [-0.30, -0.26], [-0.30, 0.26] ]"
      
      # Hier MUSS der static_layer rein
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: true
    node_names: ['map_server', 'amcl', 'planner_server', 'controller_server', 'behavior_server', 'bt_navigator']
